[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavebridge"
version = "0.1.0"
description = "Research scaffolding for checked subgroup adaptation of ML kernels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/Media-Foundry/WaveBridge"

[project.scripts]
wavebridge = "wavebridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
