name: cpu-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  clang-source-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18-dev libclang-18-dev
      - name: Build compiler-matched native capture plugin
        run: |
          clang++-18 -std=c++17 -fno-rtti -fPIC -shared compiler/frontend/native/capture_plugin.cpp \
            -I/usr/lib/llvm-18/include \
            -o "$RUNNER_TEMP/libwavebridge_capture_plugin.so"
      - name: Record compiler and run real source regressions
        env:
          PYTHONPATH: src
          WB_NATIVE_CAPTURE_PLUGIN: ${{ runner.temp }}/libwavebridge_capture_plugin.so
          WB_NATIVE_CAPTURE_COMPILER: /usr/lib/llvm-18/bin/clang++
        run: |
          export PATH=/usr/lib/llvm-18/bin:$PATH
          command -v clang++
          clang++ --version
          test "$(clang++ -dumpversion | cut -d. -f1)" = 18
          python -m unittest discover -s tests -p '*clang*.py' -v
  reference-model:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: make check
      - run: make demo
      - run: python -m pip install .
      - run: wavebridge demo
